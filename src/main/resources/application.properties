spring.application.name=renewmate

spring.profiles.default=local

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.db.enabled=true

# Authentication integrations
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}
app.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:30}
app.mail.from=${MAIL_FROM:no-reply@renewmate.com}
app.oauth.exchange-code-expiration-seconds=${OAUTH_EXCHANGE_CODE_EXPIRATION_SECONDS:60}

app.google.oauth.client-id=${GOOGLE_CLIENT_ID:}
app.google.oauth.client-secret=${GOOGLE_CLIENT_SECRET:}

# SMTP credentials must be supplied through environment variables.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
