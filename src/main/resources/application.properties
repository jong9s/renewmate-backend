spring.application.name=renewmate

spring.profiles.default=local

# Database schema is managed by Flyway in local and production profiles.
# Existing databases must already contain the V1 and V2 structures before baselining.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true
spring.jpa.hibernate.ddl-auto=validate

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.db.enabled=true

# Authentication integrations
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}
app.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:30}
app.mail.from=${MAIL_FROM:no-reply@renewmate.com}
app.oauth.exchange-code-expiration-seconds=${OAUTH_EXCHANGE_CODE_EXPIRATION_SECONDS:60}

app.google.oauth.client-id=${GOOGLE_CLIENT_ID:}
app.google.oauth.client-secret=${GOOGLE_CLIENT_SECRET:}

# SMTP credentials must be supplied through environment variables.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Incident reporting: unhandled 5xx errors -> GitHub repository_dispatch -> Slack + AI auto-fix workflow
app.incident.enabled=${INCIDENT_REPORT_ENABLED:false}
app.incident.cooldown-minutes=${INCIDENT_COOLDOWN_MINUTES:30}
app.incident.github-repository=${INCIDENT_GITHUB_REPOSITORY:jong9s/renewmate-backend}
app.incident.github-token=${INCIDENT_GITHUB_TOKEN:}
