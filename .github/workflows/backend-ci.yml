
name: Backend CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

# 동일 브랜치에서 여러 배포가 동시에 실행되지 않도록 제한
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    env:
      JWT_SECRET: renewmate-ci-jwt-secret-key-renewmate-ci-jwt-secret-key
      JWT_ACCESS_TOKEN_EXPIRATION: 3600000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew clean build

  deploy:
    name: Deploy to EC2
    needs: build

    # develop에 Push되고 CI가 통과했을 때만 배포
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Deploy with SSM
        timeout-minutes: 20

        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          DEPLOY_SHA: ${{ github.sha }}

        run: |
          set -euo pipefail

          # EC2에서 실행할 배포 명령 생성
          cat > deploy-commands.json <<EOF
          {
            "commands": [
              "set -e",
              "sudo -u ubuntu -H bash -lc 'cd /home/ubuntu/renewmate-backend && git fetch origin develop && git checkout develop && git merge --ff-only $DEPLOY_SHA && docker compose up -d --build && docker compose ps'"
            ]
          }
          EOF

          # SSM을 통해 EC2에 명령 전달
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 600 \
            --parameters file://deploy-commands.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # 최대 약 15분 동안 배포 상태 확인
          STATUS="Pending"

          for i in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text)

            echo "Deployment status: $STATUS ($i/90)"

            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut|Cancelling)
                break
                ;;
            esac

            sleep 10
          done

          # 최종 명령 상태와 출력 로그 확인
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" \
            --output json

          FINAL_STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" \
            --output text)

          if [ "$FINAL_STATUS" != "Success" ]; then
            echo "Deployment failed or did not finish: $FINAL_STATUS"
            exit 1
          fi

          echo "Deployment completed successfully."