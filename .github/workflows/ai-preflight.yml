name: AI Safety Preflight (no AI calls)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: renewmate-ai-autofix
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      vars.AI_AUTOFIX_ENABLED == 'true' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce execution limits (fail closed)
        env:
          AI_AUTOFIX_ENABLED: ${{ vars.AI_AUTOFIX_ENABLED }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B ops/automation/ai_gate.py
      - name: Rehearse incident and budget gates without paid calls
        run: python3 -B -m unittest discover -s ops/automation -p 'test_*.py'
      - name: Record phase boundary
        run: echo 'Preflight only. No AI API, code modification, push, PR or deployment.' >> "$GITHUB_STEP_SUMMARY"
