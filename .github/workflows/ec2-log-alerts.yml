name: EC2 Log Alerts

on:
  schedule:
    - cron: '47 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renewmate-ec2-log-scan
  cancel-in-progress: false

jobs:
  scan:
    if: >-
      vars.MONITORING_ENABLED == 'true' &&
      vars.EC2_LOG_MONITORING_ENABLED == 'true' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    outputs:
      error_count: ${{ steps.scan.outputs.error_count }}
      summary_b64: ${{ steps.scan.outputs.summary_b64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Test scanners without external calls
        run: python3 -B -m unittest discover -s ops/automation -p 'test_*.py'
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2
      - name: Scan bounded container logs through SSM
        id: scan
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: python3 -B ops/automation/check_ec2_logs.py

  notify:
    needs: scan
    if: needs.scan.result == 'success' && needs.scan.outputs.error_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Notify Slack with sanitized summary
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          MONITOR_EVENT: ec2_logs
          LOG_SUMMARY_B64: ${{ needs.scan.outputs.summary_b64 }}
        run: python3 -B ops/automation/notify.py
